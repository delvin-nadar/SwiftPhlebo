<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d293" />
      <stop offset="50%" stop-color="#16a6a0" />
      <stop offset="100%" stop-color="#087ea4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00d293" />
      <stop offset="45%" stop-color="#087ea4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Pin/Badge Icon -->
  <g transform="translate(10, 4)">
    <path d="M 36 6 C 18.3 6 4 20.3 4 38 C 4 50.4 11 61.1 21.4 66.4 C 26.4 68.9 31.2 71.6 34.4 75.6 C 35.6 77 37.2 76.8 38.4 75.2 C 41.6 71.2 46 68.8 50.6 66.4 C 61 61.1 68 50.4 68 38 C 68 20.3 53.7 6 36 6 Z"
          fill="#ffffff" stroke="url(#pinGrad)" stroke-width="5.5" stroke-linejoin="round"/>
    
    <circle cx="36" cy="36" r="20" fill="none" stroke="rgba(8,126,164,0.12)" stroke-width="2" stroke-dasharray="3 2.5" />
    
    <!-- Heartbeat Line -->
    <path d="M -8 36 H 18 L 24 36 L 28 22 L 33 50 L 39 16 L 44 44 L 48 33 L 52 36 H 76"
          stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="39" cy="16" r="2.5" fill="#0284c7" />
  </g>

  <!-- Wordmark Text -->
  <text x="96" y="50" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#14b8a6">Second</tspan><tspan fill="#087ea4">Medic</tspan>
  </text>
  <text x="298" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="900" fill="#087ea4">+</text>
</svg>
